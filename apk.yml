name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Umgebung anzeigen
        run: |
          echo "Node:   $(node -v)"
          echo "npm:    $(npm -v)"
          echo "Java:   $(java -version 2>&1 | head -1)"
          echo "SDK:    ${ANDROID_SDK_ROOT:-nicht gesetzt}"
          ls -la

      - name: Vorhandenen Signaturschluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          elif [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore "$HOME/.android/debug.keystore"
          else
            echo "::error::Bisheriger Signaturschluessel fehlt. signing/debug.keystore erhalten oder ANDROID_DEBUG_KEYSTORE_BASE64 als Repository-Secret setzen. Siehe GITHUB-APK-ANLEITUNG.md."
            exit 1
          fi
          NEU=$(keytool -J-Duser.language=en -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA1: *//p' | tr -d ' \r\n')
          test -n "$NEU"
          if [ -f signing/fingerabdruck.txt ]; then
            ALT=$(tr -d ' \r\n' < signing/fingerabdruck.txt)
            if [ -n "$ALT" ] && [ "$ALT" != "$NEU" ]; then
              echo "::error::Signatur weicht vom hinterlegten Fingerabdruck ab. Build abgebrochen."
              exit 1
            fi
          fi
          echo "Signatur SHA1: $NEU"

      - name: Pakete installieren
        # npm ci statt npm install: installiert GENAU die Fassungen aus
        # package-lock.json und bricht ab, wenn Sperrdatei und package.json
        # auseinanderlaufen. Mit npm install wurden die Fassungen bei jedem
        # Bau neu aufgeloest — dieselbe App.jsx konnte dann ein anderes
        # Buendel ergeben, und eine Fassungsnummer bezeichnete kein
        # bestimmtes Ergebnis. Seit 35.46 ist der Bau wiederholbar.
        # Preis: Sicherheitsnachtraege kommen nicht mehr von allein.
        # Nachziehen mit `npm update` und die neue Sperrdatei einchecken.
        run: npm ci --no-audit --no-fund

      - name: Korrekturen pruefen
        run: npm run test:korrekturen

      - name: Weboberflaeche bauen
        run: npm run build

      - name: Ergebnis der Weboberflaeche pruefen
        run: |
          test -f dist/index.html || { echo "FEHLER: dist/index.html fehlt"; exit 1; }
          ls -la dist
          # Die Schriften liegen als Base64 in schriften.js und werden in das
          # Buendel hineingebacken. Fehlt die Datei oder wird sie nicht mehr
          # eingebunden, faellt die App stumm auf Roboto zurueck - das faellt
          # sonst erst auf dem Geraet auf. Deshalb hier zaehlen.
          BUENDEL=$(ls dist/assets/index-*.js | head -1)
          N=$(grep -o '@font-face' "$BUENDEL" | wc -l)
          echo "Schriftschnitte im Buendel: $N"
          [ "$N" -ge 5 ] || { echo "FEHLER: erwartet 5 Schriftschnitte, gefunden $N"; exit 1; }
          if grep -q 'fonts.googleapis' "$BUENDEL"; then
            echo "FEHLER: Buendel laedt Schriften aus dem Netz nach"
            exit 1
          fi
          echo "Kein Nachladen aus dem Netz."
          # Seit 35.6 liegen die Ereignisse in einer eigenen Datei. Vite loest
          # den Import selbst auf, ein fehlendes ereignisse.js braeche den Bau
          # also laut ab. Was NICHT laut abbricht: eine abgeschnittene oder
          # halb eingecheckte Datei. Dasselbe Muster wie bei den Schriften.
          EV=$(grep -o 'tag:"' "$BUENDEL" | wc -l)
          echo "Ereignisse im Buendel: $EV"
          # Seit 35.17 gibt es zusaetzlich verein.js. Auch hier gilt: eine
          # fehlende Datei braeche laut ab, eine abgeschnittene nicht.
          # Minifizierung darf Funktionsnamen verändern. Das Vereinsverhalten
          # wird bereits durch test:korrekturen geprüft; den Quellimport prüft Vite.
          test -s verein.js || { echo "FEHLER: Vereinsmodul fehlt"; exit 1; }
          echo "Vereinsmodul: Quelle vorhanden, Regressionen und Web-Build erfolgreich."
          [ "$EV" -ge 400 ] || { echo "FEHLER: erwartet mindestens 400 Ereignisse, gefunden $EV"; exit 1; }

      - name: Android-Projekt anlegen
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          node pruefstand/android-version.cjs android/app/build.gradle package.json

      - name: App-Symbol erzeugen und einsetzen
        run: |
          # Das Android-Verzeichnis wird bei jedem Lauf neu angelegt, deshalb
          # muss das eigene Symbol danach hineinkopiert werden. Ohne diesen
          # Schritt traegt die App das Standardsymbol von Capacitor.
          #
          # Im Projekt liegt nur EIN Bild (symbol/appicon.png). Der ganze Satz
          # aus fuenf Bildschirmdichten wird hier erzeugt - so muss beim
          # Wechseln des Symbols nur diese eine Datei getauscht werden.
          ICON=symbol/appicon.png
          if [ ! -f "$ICON" ]; then ICON=symbol/appicon-klein.png; fi
          if [ -f "$ICON" ] && [ -f symbol/appicon.py ]; then
            python3 -m pip install --quiet --upgrade Pillow
            # Die 0 am Ende ist die Rahmenbreite. Das Bild im Projekt ist bereits
            # randlos aufbereitet - die automatische Erkennung soll hier nicht raten,
            # sie wuerde am dunklen Nachthimmel weiterschneiden. Wer ein gerahmtes
            # Bild einsetzt, streicht die 0 und laesst erkennen.
            python3 symbol/appicon.py "$ICON" symbol/erzeugt 0
            RES=android/app/src/main/res
            # Nur die Bilder und die Zusammensetzungsvorschrift ersetzen.
            # Die Farbe in values/ und die Vektorvorlagen in drawable/ bleiben
            # liegen - sie werden nicht mehr verwendet, und ein Loeschen koennte
            # Verweise brechen.
            rm -f $RES/mipmap-*/ic_launcher*.png
            rm -f $RES/mipmap-anydpi-v26/ic_launcher*.xml
            cp -rv symbol/erzeugt/res/. $RES/
            echo "--- eingesetzte Symbole ---"
            find $RES -name 'ic_launcher*' | sort
          else
            echo "FEHLER: Symbolquelle oder Erzeugungsskript fehlt."
            exit 1
          fi

      - name: Name und Symbol im Ergebnis pruefen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          S=android/app/src/main/res/values/strings.xml
          echo "--- Name ---"; grep -o 'Rasenschach[^<"]*' $S | sort -u
          grep -q 'Rasenschach XI' $S || { echo "FEHLER: App heisst nicht Rasenschach XI"; exit 1; }
          echo "--- Symbolverweis im Manifest ---"; grep -o 'android:icon="[^"]*"' $M
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png \
            || { echo "FEHLER: eigenes Symbol fehlt"; exit 1; }
          echo "Name und Symbol sitzen."

      - name: Gradle vorbereiten
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          {
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=true"
            echo "android.useAndroidX=true"
          } >> android/gradle.properties
          chmod +x android/gradlew
          cat android/local.properties

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --warning-mode=none

      - name: Signatur der fertigen APK pruefen
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT"/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"

      - name: Ergebnis suchen
        if: always()
        run: |
          echo "--- gefundene APK-Dateien ---"
          find android -name "*.apk" -type f 2>/dev/null || true
          echo "--- Inhalt des Ausgabeordners ---"
          ls -laR android/app/build/outputs 2>/dev/null || echo "kein Ausgabeordner vorhanden"

      - name: APK zum Herunterladen bereitstellen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rasenschach-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fehlerbericht
        if: failure()
        run: |
          echo "Der Bauvorgang ist fehlgeschlagen."
          echo "Bitte den obigen Schritt mit dem roten Kreuz aufklappen"
          echo "und die letzten 30 Zeilen weitergeben."
